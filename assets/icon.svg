<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3718"/>
      <stop offset="1" stop-color="#2b1d10"/>
    </linearGradient>
    <linearGradient id="hay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd46a"/>
      <stop offset="1" stop-color="#b9832a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fb3c0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- floor line -->
  <rect x="0" y="392" width="512" height="120" fill="#20150a"/>

  <!-- haystack -->
  <path d="M256 104 L404 392 H108 Z" fill="url(#hay)"/>
  <path d="M256 104 L330 248 L256 392 Z" fill="#000" opacity=".07"/>
  <g stroke="#8d6017" stroke-width="7" stroke-linecap="round" opacity=".55">
    <path d="M186 300 l44 -22"/>
    <path d="M300 320 l46 18"/>
    <path d="M232 214 l40 14"/>
    <path d="M292 268 l44 -16"/>
    <path d="M166 352 l52 10"/>
  </g>

  <!-- needle, leaning out of the stack -->
  <g transform="rotate(-34 300 250)">
    <rect x="292" y="132" width="16" height="200" rx="8" fill="url(#steel)"/>
    <circle cx="300" cy="158" r="17" fill="none" stroke="url(#steel)" stroke-width="13"/>
    <path d="M292 332 L300 372 L308 332 Z" fill="#d8e4ec"/>
  </g>

  <!-- glint -->
  <g fill="#fff8d6">
    <path d="M382 148 l10 30 30 10 -30 10 -10 30 -10 -30 -30 -10 30 -10 Z"/>
  </g>
</svg>
