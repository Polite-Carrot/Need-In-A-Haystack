<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2b1d10" />
<title>Need in a Haystack</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
</head>
<body>
<div id="game">
  <canvas id="scene"></canvas>

  <!-- Top HUD -->
  <header id="hud">
    <div class="hud-row">
      <div class="coins" id="coinBox">
        <span class="coin-icon">🪙</span><span id="coinCount">0</span>
      </div>
      <div class="hud-right">
        <button class="icon-btn" id="muteBtn" title="Sound">🔊</button>
        <button class="icon-btn" id="statsBtn" title="Stats">📊</button>
      </div>
    </div>
    <div class="stack-meta">
      <span id="stackName">Haystack #1</span>
      <span id="stackProgressText">0 / 0 hay searched</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="stackProgress"></div></div>
    <div id="detectorLine" class="detector-line"></div>
  </header>

  <!-- Bottom bar -->
  <footer id="bottom">
    <div class="shovel-status">
      <div class="shovel-label">
        <span id="shovelName">Bare Hands</span>
        <span id="shovelLoad">0 / 4</span>
      </div>
      <div class="load-track"><div class="load-fill" id="loadFill"></div></div>
    </div>
    <button id="shopBtn" class="shop-btn">🛒 Shop<span id="shopDot" class="dot hidden"></span></button>
  </footer>

  <div id="hint" class="hint">Tap the haystack to fill your shovel</div>

  <!-- Shop drawer -->
  <section id="shop" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="tabs">
        <button class="tab active" data-tab="shovels">Shovels</button>
        <button class="tab" data-tab="upgrades">Upgrades</button>
      </div>
      <button class="icon-btn" id="closeShop">✕</button>
    </div>
    <div class="drawer-coins">🪙 <span id="shopCoins">0</span></div>
    <div class="drawer-body" id="shopBody"></div>
  </section>

  <!-- Stats modal -->
  <section id="statsModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <h2>Dig Report</h2>
      <ul id="statsList" class="stats-list"></ul>
      <button class="btn ghost danger" id="resetBtn">Reset everything</button>
      <button class="btn" id="closeStats">Back to digging</button>
    </div>
  </section>

  <!-- Needle found -->
  <section id="winModal" class="modal win" aria-hidden="true">
    <div class="modal-card">
      <div class="needle-art">🪡</div>
      <h2>You found the needle!</h2>
      <p id="winText"></p>
      <div class="win-stats" id="winStats"></div>
      <button class="btn big" id="nextStackBtn">Find a bigger haystack</button>
    </div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
